repos:
  - repo: local
    hooks:
      # Commit-time gate: a type error is caught before it can reach a branch,
      # and nothing else. Lint moved to pre-push because it was 5.4s of the
      # 14.8s this used to cost, which put every commit in the band where
      # people start context-switching while they wait.
      - id: commit-gate
        name: Commit Gate
        entry: bun run check:server
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: branch-current-with-main
        name: Branch Current With Main
        entry: scripts/check-branch-current.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Everything except the two browser suites. `bun run verify` (the full
      # 147s run including ui-smoke and control-plane-e2e) stays the canonical
      # gate and is what CI enforces through the required Verification Gate
      # check, so nothing merges without it. Paying for two Playwright browser
      # runs on every push -- including a push that only deletes a branch --
      # bought no safety that the required check did not already provide.
      - id: verification-gate-local
        name: Verification Gate (local)
        entry: bun run verify:local
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
