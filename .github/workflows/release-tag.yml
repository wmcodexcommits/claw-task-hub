# Tag main when a release PR lands.
#
# Pushing the tag is what triggers release.yml, which verifies, packages for
# three platforms and publishes. Tags are outside MAINPROTECT, which targets
# branches, so this needs no bypass.
name: Release Tag

on:
  push:
    branches: [main]
    paths: ["package.json"]

permissions:
  contents: write

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: Tag when the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "v$version already exists; nothing to tag."
            exit 0
          fi
          # Refuse to tag a tree the release gate would reject anyway: a version
          # with no CHANGELOG section produces a release nobody can read.
          bun run release:version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "Release v$version"
          git push origin "v$version"
          echo "Tagged v$version; release.yml will publish it."
