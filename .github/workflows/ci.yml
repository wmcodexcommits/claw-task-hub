name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verification:
    name: Verification Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Run canonical verification gate
        run: bun run verify

  windows-portability:
    name: Windows Portability
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install from the canonical lockfile
        run: bun install --frozen-lockfile

      - name: Verify Windows-sensitive runtime and package paths
        run: bun run build && bun run store-regression && bun run harness-smoke && bun run open-context-smoke && bun run release-package-smoke
