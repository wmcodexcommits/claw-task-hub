# Compute the next version from the commits since the last tag and open a PR
# that applies it.
#
# It opens a pull request rather than pushing to main because MAINPROTECT has
# no bypass actors: the workflow's token is as blocked as everyone else, which
# is the point. Merging the PR is what arms the tag job.
name: Release Prepare

on:
  workflow_dispatch:
    inputs:
      release_as:
        description: "Override the computed version (e.g. 1.0.0). Leave empty to derive it from the commits."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # The bump reads the log back to the last tag, so a shallow clone
          # would silently classify only the newest commits.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Compute and apply the version
        id: bump
        run: |
          bun scripts/release-version.mjs ${{ inputs.release_as && format('--apply --release-as {0}', inputs.release_as) || '--apply' }} | tee bump.txt
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git diff --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open the release pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore: release $VERSION"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: release $VERSION" \
            --body "$(printf 'Derived from the commits since the last tag.\n\n```\n%s\n```\n\nMerging this tags `v%s` and publishes the release.' "$(cat bump.txt)" "$VERSION")"

      - name: Report when there is nothing to release
        if: steps.bump.outputs.changed != 'true'
        run: cat bump.txt
